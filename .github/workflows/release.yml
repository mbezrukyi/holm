name: release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          if [[ $GITHUB_REF != refs/heads/master ]]; then
            echo "release runs only on master, not $GITHUB_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: version
        run: |
          pkgid=$(cargo pkgid --locked -p holm)
          version=${pkgid##*[#@]}
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already has a release; bump the version first" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## $VERSION" '
            $0 == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' > "$notes"
          if [[ ! -s $notes ]]; then
            echo "CHANGELOG.md has no section ## $VERSION" >&2
            exit 1
          fi
          appimage="Holm-$VERSION-x86_64.AppImage"
          printf '\nDownload `%s` and `SHA256SUMS`. Check your download: `sha256sum -c SHA256SUMS` and `gh release verify-asset v%s %s -R mbezrukyi/holm`. See [Install](https://github.com/mbezrukyi/holm#install).\n' \
            "$appimage" "$VERSION" "$appimage" >> "$notes"
      - uses: ./.github/actions/linux-deps
      - run: cargo "+$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" install --locked --features cli "cargo-about@$(sed -n 's/^cargo_about_version=//p' scripts/check)"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/appimage/build.sh "$VERSION"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "target/appimage/Holm-$VERSION-x86_64.AppImage" \
            target/appimage/SHA256SUMS \
            target/appimage/THIRD-PARTY-NOTICES.txt
