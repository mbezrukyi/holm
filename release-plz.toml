[workspace]
git_only = true
release_always = false
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "holm"
version_group = "holm"
git_tag_enable = true
git_release_enable = true
git_release_name = "v{{ version }}"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["holm-core", "holm-markdown", "holm-editor"]

[[package]]
name = "holm-core"
version_group = "holm"

[[package]]
name = "holm-markdown"
version_group = "holm"

[[package]]
name = "holm-editor"
version_group = "holm"
