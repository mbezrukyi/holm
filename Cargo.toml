[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
holm-core = { path = "crates/holm-core" }
holm-markdown = { path = "crates/holm-markdown" }
holm-editor = { path = "crates/holm-editor" }
holm-editor-test = { path = "crates/holm-editor-test" }

gpui-kit = { version = "=0.9.0", default-features = false }
fontdb = "0.23"
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
futures-channel = "0.3"
futures-core = "0.3"
foldhash = { version = "0.2", default-features = false }
imagesize = "0.14"
imbl = "7"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
notify = { version = "8.2", default-features = false }
num-traits = { version = "0.2", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
ropey = { version = "=2.0.0-beta.1", default-features = false, features = ["metric_lines_lf", "metric_utf16"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
sha2 = { version = "0.10", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
tempfile = "3"
thiserror = "2"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ttf-parser = "0.25"
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
ulid = "3"

bitflags = "2"

divan = "0.1"
insta = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
redundant_clone = "warn"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre = { path = "vendor/gpui-pre" }
