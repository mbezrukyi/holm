[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
holm-core = { path = "crates/holm-core" }
holm-markdown = { path = "crates/holm-markdown" }
holm-editor = { path = "crates/holm-editor" }

gpui-kit = "=0.9.0"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
notify = { version = "8.2", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
ulid = "3"

divan = "0.1"
insta = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
