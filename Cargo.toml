[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
holm-core = { path = "crates/holm-core" }
holm-markdown = { path = "crates/holm-markdown" }
holm-editor = { path = "crates/holm-editor" }

gpui-kit = { version = "=0.9.0", default-features = false }
fontdb = "0.23"
futures-channel = "0.3"
imagesize = "0.14"
imbl = "7"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
notify = { version = "8.2", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
# The same version as in gpui-component.
ropey = { version = "=2.0.0-beta.1", default-features = false, features = ["metric_lines_lf", "metric_utf16"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
# The same versions and features as the `syntect` feature of gpui-component.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
tempfile = "3"
thiserror = "2"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ttf-parser = "0.25"
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
ulid = "3"

divan = "0.1"
insta = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# A copy of gpui-pre-linux 0.3.11 with one fix: X11 file drop positions are divided by the
# screen scale, like other pointer positions. Remove it when a release has the fix.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
