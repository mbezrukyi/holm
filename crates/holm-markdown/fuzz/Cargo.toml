[package]
name = "holm-markdown-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
holm-markdown = { path = ".." }
libfuzzer-sys = "0.4"

# Its own workspace keeps it out of the Holm workspace, because it needs nightly Rust.
[workspace]
members = ["."]

[[bin]]
name = "body"
path = "fuzz_targets/body.rs"
test = false
doc = false
bench = false
