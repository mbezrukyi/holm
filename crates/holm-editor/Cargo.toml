[package]
name = "holm-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bitflags.workspace = true
fontdb.workspace = true
gpui-kit.workspace = true
holm-markdown.workspace = true
icu_segmenter.workspace = true
imagesize.workspace = true
num-traits.workspace = true
ropey.workspace = true
syntect.workspace = true
thiserror.workspace = true
ttf-parser.workspace = true
two-face.workspace = true

[features]
# Publishes the editor text for UI tests, which a normal build never copies, and the `testing` module: helpers for
# tests and benches.
test-support = ["gpui-kit/test-support"]

[dev-dependencies]
divan.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
holm-editor = { path = ".", features = ["test-support"] }
proptest.workspace = true

[[bench]]
name = "edit"
harness = false

[lints]
workspace = true
