[graph]
all-features = true

[advisories]
# Unmaintained crates deep in GPUI and other libraries can't be fixed here. Report only the ones
# that holm uses directly. Vulnerabilities are reported for all crates.
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "GPUI's font code uses ttf-parser too. Replace it when GPUI moves off it." },
]

[licenses]
# LGPL is allowed only for system libraries, each as an exception.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Unused entries stay, so new crates with these licences pass.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
