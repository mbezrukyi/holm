[graph]
all-features = true

[advisories]
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "GPUI's font code uses ttf-parser too. Replace it when GPUI moves off it." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
